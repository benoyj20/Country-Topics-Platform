name: countrytopics

# Local development and pilot services. Production uses managed equivalents
# (PostgreSQL, Redis-compatible cache, SMTP provider, S3-compatible storage)
# configured through the same environment variables; see
# docs/adr/0001-initial-architecture.md.
# Ports bind to 127.0.0.1 so these services are never exposed on the network.

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-countrytopics}
      POSTGRES_USER: ${POSTGRES_USER:-countrytopics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-countrytopics_dev}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The shared page cache's own Valkey (ADR 0013): capped, evicting the
  # least recently used pages, and not saved to disk, so a full cache can
  # never take memory the queues in "redis" need (they must never evict).
  cache:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:${PAGE_CACHE_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # S3-compatible object storage for uploads (SeaweedFS in its single-process
  # mode). Production uses a managed S3-compatible service through the same
  # S3_* variables. It creates the site's bucket, the integration tests'
  # bucket, and the local backup bucket on start.
  storage:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
      - -admin.ui=false
      - -bucket=${S3_BUCKET:-countrytopics},${TEST_S3_BUCKET:-countrytopics-test},${BACKUP_S3_BUCKET:-countrytopics-backups}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-countrytopics}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-countrytopics_dev_secret}
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-8333}:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      # Any HTTP answer (unsigned requests get 403) means the S3 API is up.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 403"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Backups (ADR 0012): a database dump and a copy of new uploads once a
  # day, kept for 14 days. Locally they go to a bucket in the storage
  # service above, on the same disk; for the pilot, point BACKUP_S3_* at
  # another service. `make backup`, `make backup-list`, and `make restore`
  # run its other commands.
  backup:
    build:
      context: ../..
      dockerfile: apps/backup/Dockerfile
    image: countrytopics-backup
    command: ["schedule"]
    restart: unless-stopped
    # Passes stop signals on, so Ctrl+C ends make backup and make restore.
    init: true
    environment:
      # Which environment it backs up (ADR 0014); a hosted one refuses local
      # services.
      APP_ENV: ${APP_ENV:-local}
      # The database and uploads as containers reach them: the Compose
      # services unless CONTAINER_* names others (such as managed ones).
      # The Compose database's password comes in PGPASSWORD, outside the URL.
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgres://${POSTGRES_USER:-countrytopics}@postgres:5432/${POSTGRES_DB:-countrytopics}?sslmode=disable}
      PGPASSWORD: ${POSTGRES_PASSWORD:-countrytopics_dev}
      S3_ENDPOINT: ${CONTAINER_S3_ENDPOINT:-http://storage:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-countrytopics}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-countrytopics}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-countrytopics_dev_secret}
      # Empty settings fall back to the S3_* ones above.
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-countrytopics-backups}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      # Failed backups, and a newest backup over two days old, are reported.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      # For make test-backup only: the server its tests make databases on.
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-countrytopics}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy

  # The scale rehearsal (ADR 0013, docs/runbooks/scale-rehearsal.md):
  # `make scale-up` starts two web and two worker containers behind a load
  # balancer at http://localhost:8080, on a database and bucket restored
  # from a backup, so development data is never touched.
  web:
    profiles: ["scale"]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: countrytopics-web
    deploy:
      replicas: 2
    init: true
    env_file:
      - path: ../../.env
        required: false
    environment: &scale-environment
      # Always local: it runs on this machine at localhost:8080.
      APP_ENV: local
      # Its own database, never CONTAINER_DATABASE_URL, which names the
      # real one for backups.
      DATABASE_URL: ${SCALE_DATABASE_URL:-postgres://${POSTGRES_USER:-countrytopics}@postgres:5432/countrytopics_rehearsal?sslmode=disable}
      PGPASSWORD: ${POSTGRES_PASSWORD:-countrytopics_dev}
      DATABASE_REPLICA_URL: ""
      REDIS_URL: redis://redis:6379
      PAGE_CACHE_URL: redis://cache:6379
      SMTP_URL: smtp://mailpit:1025
      S3_ENDPOINT: ${CONTAINER_S3_ENDPOINT:-http://storage:8333}
      S3_BUCKET: ${SCALE_S3_BUCKET:-countrytopics-rehearsal}
      SITE_URL: http://localhost:${SCALE_HOST_PORT:-8080}
      # Apart from development's queues, limits, and page cache.
      QUEUE_PREFIX: countrytopics-scale
      # Every request comes through the load balancer, which sets it.
      CLIENT_IP_HEADER: x-forwarded-for
      # Google's registered redirect is the development address.
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      TURNSTILE_SITE_KEY: ""
      TURNSTILE_SECRET_KEY: ""
      SENTRY_ENVIRONMENT: rehearsal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy

  worker:
    profiles: ["scale"]
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    image: countrytopics-worker
    deploy:
      replicas: 2
    init: true
    env_file:
      - path: ../../.env
        required: false
    environment: *scale-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  lb:
    profiles: ["scale"]
    image: caddy:2.11.7-alpine
    ports:
      - "127.0.0.1:${SCALE_HOST_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy

  # Load tests (deploy/load-tests), run by `make load-test` against the load
  # balancer inside this network.
  k6:
    profiles: ["scale"]
    image: grafana/k6:1.8.2
    volumes:
      - ../load-tests:/scripts:ro
    environment:
      BASE_URL: http://lb:8080

volumes:
  postgres-data:
  redis-data:
  storage-data:
