name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: countrytopics_test
          POSTGRES_USER: countrytopics
          POSTGRES_PASSWORD: countrytopics_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U countrytopics -d countrytopics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
      storage:
        # The image's default command is "mini -dir=/data", which creates the
        # bucket named in S3_BUCKET.
        image: chrislusf/seaweedfs:4.48
        env:
          AWS_ACCESS_KEY_ID: ci-access-key
          AWS_SECRET_ACCESS_KEY: ci-secret-key-not-used-elsewhere
          S3_BUCKET: countrytopics-test
        ports:
          - 8333:8333
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 403"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway values for the CI services and build; nothing here is deployed.
      DATABASE_URL: postgres://countrytopics:countrytopics_ci@localhost:5432/countrytopics_test?sslmode=disable
      TEST_DATABASE_URL: postgres://countrytopics:countrytopics_ci@localhost:5432/countrytopics_test?sslmode=disable
      PAYLOAD_SECRET: ci-only-placeholder-value-not-used-anywhere-else
      BETTER_AUTH_SECRET: ci-only-placeholder-value-not-used-anywhere-else
      SITE_URL: http://localhost:3000
      BACKEND_URL: http://localhost:3002
      FORWARDING_KEY: ci-only-placeholder-value-not-used-anywhere-else
      PURGE_KEY: ci-only-purge-placeholder-not-used-anywhere-else
      REDIS_URL: redis://localhost:6379
      SMTP_URL: smtp://localhost:1025
      TEST_MAILPIT_URL: http://localhost:8025
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: countrytopics-test
      TEST_S3_BUCKET: countrytopics-test
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key-not-used-elsewhere
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:int
      # The backup tests run pg_dump and pg_restore, which must match the
      # PostgreSQL 17 server; the runner's own client is older.
      - name: Install the PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: pnpm --filter @countrytopics/backup test:backup
      - run: pnpm build
      - name: Generated Payload files and migrations match the config
        run: |
          pnpm --filter @countrytopics/api generate
          pnpm --filter @countrytopics/api migrate:create schema-drift --skip-empty
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Run 'make generate' and 'pnpm --filter @countrytopics/api migrate:create <name>', then commit the result."
            exit 1
          fi

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f deploy/compose/compose.yaml config --quiet
      - name: Every image uses the Node.js version in .node-version
        run: |
          version="$(tr -d '[:space:]' < .node-version)"
          stale="$(grep -Hn '^FROM node:' apps/*/Dockerfile prototypes/*/Dockerfile | grep -v "FROM node:${version}-" || true)"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::Every Dockerfile's FROM node: line must use Node.js ${version}, from .node-version."
            exit 1
          fi
      - name: The backup, API, and worker images build
        run: docker compose --env-file .env -f deploy/compose/compose.yaml --profile scale build backup api worker
      - name: The frontend's Workers image builds and starts
        run: |
          docker build -f apps/frontend/Dockerfile -t countrytopics-frontend-worker .
          docker run -d --name frontend-worker -p 127.0.0.1:8788:8788 \
            -e FORWARDING_KEY="$(openssl rand -hex 32)" \
            -e PURGE_KEY="$(openssl rand -hex 32)" \
            -e SITE_OPERATOR=CI -e CONTACT_EMAIL=ci@example.test \
            countrytopics-frontend-worker
          # The Worker refuses an unsigned purge itself, so a 403 shows it
          # started and runs the site's code, with no backend needed.
          status=none
          for attempt in $(seq 1 30); do
            status="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8788/api/revalidate || true)"
            if [ "$status" = 403 ]; then exit 0; fi
            sleep 2
          done
          echo "::error::The frontend's Workers image did not refuse an unsigned purge with 403 (last status: ${status})."
          docker logs frontend-worker
          exit 1
